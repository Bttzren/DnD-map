# Builds the DnD Map desktop app (for the DM) on Windows, macOS and Linux.
# Every push uploads the installers as build artifacts; pushing a tag like
# v0.2.0 also attaches them to a GitHub release, which the website links to.
name: Desktop app

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Prepare the app
        run: npm run desktop:prepare

      - name: Install the desktop tools
        working-directory: desktop
        run: npm ci

      - name: Build the installer
        working-directory: desktop
        run: npx electron-builder --publish never
        env:
          # No paid signing certificates: Windows and macOS will warn on first open.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: DnD-Map-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
